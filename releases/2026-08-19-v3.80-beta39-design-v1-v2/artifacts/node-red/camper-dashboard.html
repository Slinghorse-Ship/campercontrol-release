    <symbol id="fs-bulb" viewBox="0 0 32 32"><path d="M9 14a7 7 0 1 1 14 0c0 5-4 5-4 9h-6c0-4-4-4-4-9zM12 26h8M14 29h4M16 1v4M5 5l3 3M27 5l-3 3M2 15h4M26 15h4"/></symbol>
    <symbol id="fs-wall-light" viewBox="0 0 32 32"><rect x="5" y="8" width="16" height="16" rx="3"/><circle cx="10" cy="13" r="1"/><circle cx="16" cy="13" r="1"/><circle cx="10" cy="19" r="1"/><circle cx="16" cy="19" r="1"/><path d="M24 10l5-3M24 16h6M24 22l5 3"/></symbol>

    <symbol id="fs-lightbar" viewBox="0 0 32 32"><rect x="2" y="11" width="28" height="10" rx="2"/><circle cx="6" cy="16" r="1"/><circle cx="11" cy="16" r="1"/><circle cx="16" cy="16" r="1"/><circle cx="21" cy="16" r="1"/><circle cx="26" cy="16" r="1"/></symbol>
    <symbol id="fs-warningbar" viewBox="0 0 32 32"><rect x="2" y="11" width="28" height="10" rx="2"/><path d="M6 14h4l-3 4h4M14 14h4l-3 4h4M22 14h4l-3 4h4M16 7V3M5 8 2 5M27 8l3-3M5 24l-3 3M27 24l3 3"/></symbol>
    <symbol id="fs-highbeam" viewBox="0 0 32 32"><path d="M15 7C9 7 5 11 5 16s4 9 10 9zM19 9h10M19 14h10M19 19h10M19 24h10"/></symbol>
    <symbol id="fs-outlet" viewBox="0 0 32 32"><rect x="5" y="4" width="22" height="24" rx="5"/><circle cx="16" cy="16" r="7"/><path d="M13 13v3M19 13v3M16 19v3"/></symbol>
    <symbol id="fs-pump" viewBox="0 0 32 32"><circle cx="13" cy="18" r="7"/><circle cx="13" cy="18" r="2"/><path d="M1 18h5M20 18h8v8M23 3c4 5 4 8 0 10-4-2-4-5 0-10z"/></symbol>
    <symbol id="fs-satellite" viewBox="0 0 32 32"><path d="M5 7c8 0 14 6 14 14-8 0-14-6-14-14zM13 15l-6 10M4 27h14M21 7a6 6 0 0 1 5 5M21 2a11 11 0 0 1 10 10"/></symbol>
    <symbol id="fs-fan" viewBox="0 0 32 32"><circle cx="16" cy="16" r="3"/><path d="M16 13c-2-7 1-10 4-10 5 1 5 7 1 12M19 17c7-2 10 1 10 4-1 5-7 5-12 1M14 19c2 7-1 10-4 10-5-1-5-7-1-12M13 14C6 16 3 13 3 10c1-5 7-5 12-1"/></symbol>
    <symbol id="fs-left-light" viewBox="0 0 32 32"><rect x="9" y="8" width="19" height="13" rx="2"/><circle cx="13" cy="14.5" r="1"/><circle cx="18.5" cy="14.5" r="1"/><circle cx="24" cy="14.5" r="1"/><path d="M7 10 2 7M7 14.5H1M7 19l-5 3"/></symbol>
    <symbol id="fs-right-light" viewBox="0 0 32 32"><rect x="4" y="8" width="19" height="13" rx="2"/><circle cx="8" cy="14.5" r="1"/><circle cx="13.5" cy="14.5" r="1"/><circle cx="19" cy="14.5" r="1"/><path d="m25 10 5-3m-5 7.5h6M25 19l5 3"/></symbol>
    <symbol id="fs-down-light" viewBox="0 0 32 32"><rect x="6" y="5" width="20" height="12" rx="2"/><circle cx="10" cy="11" r="1"/><circle cx="16" cy="11" r="1"/><circle cx="22" cy="11" r="1"/><path d="m9 20-3 7m10-7v9m7-9 3 7"/></symbol>
    <symbol id="fs-plug" viewBox="0 0 32 32"><path d="M11 4v8M21 4v8M8 12h16v3a8 8 0 0 1-8 8v5M11 28h10M16 15l-3 5h4l-2 5"/></symbol>
    <symbol id="fs-wifi" viewBox="0 0 32 32"><path d="M3 12c7-7 19-7 26 0M7 17c5-5 13-5 18 0M11 22c3-3 7-3 10 0"/><circle cx="16" cy="27" r="1.5"/></symbol>
    <symbol id="fs-home" viewBox="0 0 32 32"><path d="M3 15 16 3l13 12M7 13v16h7v-9h6v9h5V13"/></symbol>
  </defs></svg>
  <template v-if="designV2">
<!-- CAMPERCONTROL_V2_MARKUP -->
  </template>
  <template v-else>
  <header class="fs-top">
    <div class="fs-brand"><img class="fs-camper-icon" src="/camper-assets/CamperIcon.png"><div><b>{{designV2?v2PageLabel():(s.system?.name||'FORD TRANSIT CAMPER').toUpperCase()}}</b><small v-if="!designV2">· {{pageLabel()}}</small></div></div>
    <div class="fs-system"><i :class="s.system?.online?'online':'offline'"></i><span>{{s.system?.online?'VERBUNDEN':'KEINE VERBINDUNG'}}</span><button @click="dayMode=!dayMode">{{dayMode?'☾':'☀'}}</button><button class="fs-settings-top" @click="page='settings';detail=''"><svg><use href="#fs-settings"></use></svg><b>EINST.</b></button></div>
  </header>


  <section v-if="detail==='battery'" class="fs-page fs-detail-page">
    <div class="fs-detail-head"><button @click="detail=''">‹ ZURÜCK</button><svg class="fs-detail-icon"><use href="#fs-battery"></use></svg><div><small>VICTRON SMARTSHUNT</small><b>BATTERIEN</b></div><i :class="s.energy?.battery?.online?'online':'offline'"></i></div>
    <div class="fs-detail-grid battery-detail">
      <article class="fs-hero"><small>AUFBAUBATTERIE</small><strong>{{fmt(s.energy?.battery?.soc,1)}} %</strong><span>{{fmt(s.energy?.battery?.voltage,2)}} V · {{signed(s.energy?.battery?.power)}} W</span></article>
      <article><h3>SmartShunt</h3><p><span>Strom</span><b>{{signed(s.energy?.battery?.current)}} A</b></p><p><span>Verbrauchte Kapazität</span><b>{{fmt(s.energy?.battery?.consumedAh,1)}} Ah</b></p><p><span>Installierte Kapazität</span><b>{{fmt(s.energy?.battery?.installedCapacityAh,0)}} Ah</b></p><p><span>Restzeit</span><b>{{duration(s.energy?.battery?.timeToGoSeconds)}}</b></p></article>
      <article><h3>Messung 2</h3><div class="fs-large-value">{{fmt(s.energy?.battery?.starterVoltage,2)}} V</div><small>STARTERBATTERIE</small><p><span>Status</span><b>{{s.energy?.battery?.online?'ONLINE':'OFFLINE'}}</b></p></article>
      <article><h3>Trend</h3><p><span>SOC Änderung 1 h</span><b>{{signed(s.history?.forecast?.batterySocChange1h)}} %</b></p><p><span>Aktuelle Richtung</span><b>{{Number(s.energy?.battery?.power||0)>=0?'LADEN':'ENTLADEN'}}</b></p><p><span>Datenquelle</span><b>VICTRON D-BUS</b></p></article>
    </div>
  </section>

  <section v-else-if="detail==='solar'" class="fs-page fs-detail-page">
    <div class="fs-detail-head"><button @click="detail=''">‹ ZURÜCK</button><svg class="fs-detail-icon"><use href="#fs-solar"></use></svg><div><small>VICTRON + LOKALES NETZ</small><b>SOLAR & INDEVOLT</b></div><i :class="s.energy?.solar?.online?'online':'offline'"></i></div>
    <div class="fs-solar-summary"><article><small>SOLAR GESAMT</small><b>{{fmt(s.energy?.totalSolarPower,0)}} W</b></article><article><small>VICTRON MPPT</small><b>{{fmt(s.energy?.solar?.power,0)}} W</b></article><article><small>ERTRAG HEUTE</small><b>{{fmt(s.energy?.solar?.yieldTodayKwh,2)}} kWh</b></article><article><small>INDEVOLT</small><b>{{fmt(s.energy?.indevolt?.solarPower,0)}} W</b></article><article><small>ORION XS</small><b>{{fmt(s.energy?.orion?.power,0)}} W</b></article></div>
    <div class="fs-solar-grid">
      <article v-for="c in s.energy?.solar?.chargers||[]" :key="c.instance"><div class="fs-card-top"><span>MPPT {{c.instance}}</span><i :class="c.online?'online':'offline'"></i></div><h3>{{c.name}}</h3><strong>{{fmt(c.power,0)}} W</strong><p><span>PV-Spannung</span><b>{{fmt(c.pvVoltage,2)}} V</b></p><p><span>Ertrag heute</span><b>{{fmt(c.yieldTodayKwh,2)}} kWh</b></p><small>{{c.serial||c.service}}</small></article>
      <article v-for="d in s.energy?.indevolt?.devices||[]" :key="d.serial||d.ip" class="indevolt"><div class="fs-card-top"><span>INDEVOLT</span><i :class="d.online?'online':'offline'"></i></div><h3>{{d.serial||d.ip}}</h3><strong>{{fmt(d.solarPower,0)}} W</strong><p><span>Ladezustand</span><b>{{fmt(d.soc,0)}} %</b></p><p><span>Batterieleistung</span><b>{{signed(d.batteryPower)}} W</b></p><p><span>Status</span><b>{{d.status||'–'}}</b></p><small>{{d.ip}} · {{d.firmware||'Firmware –'}}</small></article>
      <article class="orion"><div class="fs-card-top"><span>LICHTMASCHINE</span><i :class="s.energy?.orion?.online?'online':'offline'"></i></div><h3>Orion XS 12/12-50A</h3><strong>{{fmt(s.energy?.orion?.power,0)}} W</strong><p><span>Lichtmaschine</span><b>{{fmt(s.energy?.orion?.inputVoltage,2)}} V · {{fmt(s.energy?.orion?.inputPower,0)}} W</b></p><p><span>Umwandlung → Bordnetz</span><b>{{fmt(s.energy?.orion?.voltage,2)}} V · {{fmt(s.energy?.orion?.current,1)}} A · {{fmt(s.energy?.orion?.power,0)}} W</b></p><p><span>Status</span><b>{{s.energy?.orion?.stateText||'–'}}</b></p><button :class="['fs-action',s.energy?.orion?.on?'on':'']" @click="orionToggle">ORION {{s.energy?.orion?.on?'AUS':'EIN'}}</button></article>
    </div>
  </section>

  <section v-else-if="detail==='temperature'" class="fs-page fs-detail-page">
    <div class="fs-detail-head"><button @click="detail=''">‹ ZURÜCK</button><svg class="fs-detail-icon"><use href="#fs-climate"></use></svg><div><small>KLIMAREGELUNG</small><b>INNENTEMPERATUR</b></div><strong>{{fmt(s.climate?.roomTemperature,1)}} °C</strong></div>
    <div class="fs-temp-layout">
      <div class="fs-temp-readings">
        <article v-for="r in temperatureReadings" :key="r.name"><small>{{r.name}}</small><b>{{fmt(r.value,1)}} °C</b><span>{{r.note}}</span></article>
      </div>
      <article class="fs-control-panel"><div class="fs-tabs"><button v-for="(t,i) in ['INNEN','CERBO CPU','SENSOREN']" :class="{on:temperatureControlTab===i}" @click="temperatureControlTab=i">{{t}}</button></div>
        <template v-if="temperatureControlTab===0"><h3>Automatische Klimaregelung</h3><div class="fs-segments"><button v-for="m in ['auto','heat','cool']" :class="{on:s.climate?.automation?.mode===m}" @click="climatePatch({mode:m})">{{m==='auto'?'AUTO':m==='heat'?'HEIZEN':'KÜHLEN'}}</button></div><div class="fs-step"><button @click="climateTarget(-1)">−</button><div><b>{{fmt(s.climate?.automation?.targetTemperature,0)}} °C</b><small>SOLLTEMPERATUR</small></div><button @click="climateTarget(1)">+</button></div><div class="fs-step compact"><button @click="climateFan(-10)">−</button><div><b>{{fmt(s.climate?.automation?.fanSpeed,0)}} %</b><small>MAXXFAN KÜHLLEISTUNG</small></div><button @click="climateFan(10)">+</button></div><button :class="['fs-action',s.climate?.automation?.enabled?'on':'']" @click="climatePatch({enabled:!s.climate?.automation?.enabled})">AUTOMATIK {{s.climate?.automation?.enabled?'AUS':'EIN'}}</button><p><span>Anforderung</span><b>{{s.climate?.automation?.demand||'idle'}}</b></p><p><span>Status</span><b>{{s.climate?.automation?.reason||'–'}}</b></p></template>
        <template v-else-if="temperatureControlTab===1"><h3>Cerbo-CPU-Lüftung</h3><div class="fs-large-value">{{fmt(s.climate?.ventilation?.cpuTemperature,1)}} °C</div><div class="fs-step"><button @click="cpuTemp(-1)">−</button><div><b>{{fmt(s.climate?.ventilation?.onTemperature,0)}} °C</b><small>EINSCHALTTEMPERATUR</small></div><button @click="cpuTemp(1)">+</button></div><div class="fs-step compact"><button @click="cpuHysteresis(-1)">−</button><div><b>{{fmt(s.climate?.ventilation?.hysteresis,0)}} K</b><small>HYSTERESE</small></div><button @click="cpuHysteresis(1)">+</button></div><button :class="['fs-action',s.climate?.ventilation?.enabled?'on':'']" @click="ventilationPatch({enabled:!s.climate?.ventilation?.enabled})">CPU-AUTOMATIK {{s.climate?.ventilation?.enabled?'AUS':'EIN'}}</button><button :class="['fs-action',s.climate?.ventilation?.manualOn?'on':'']" @click="ventilationPatch({manualOn:!s.climate?.ventilation?.manualOn})">LÜFTER MANUELL {{s.climate?.ventilation?.manualOn?'AUS':'EIN'}}</button><p><span>Abluft · Relais 1</span><b>{{s.climate?.ventilation?.exhaustOn?'EIN':'AUS'}}</b></p><p><span>Zuluft · Relais 2</span><b>{{s.climate?.ventilation?.supplyOn?'EIN':'AUS'}}</b></p><p><span>Status</span><b>{{s.climate?.ventilation?.reason||'–'}}</b></p></template>
        <template v-else><h3>Feste RuuviTag-Zuordnung</h3><p><span>Decke · FB31</span><b>{{s.climate?.temperatureSensors?.ceiling?.online?'ONLINE':'OFFLINE'}}</b></p><p><span>Victron-Dienst</span><b>com.victronenergy.temperature/24</b></p><p><span>Boden</span><b>{{s.climate?.temperatureSensors?.floor?.online?'ONLINE':'NICHT KONFIGURIERT'}}</b></p><div class="fs-sensor-list"><span>Die Zuordnung ist bewusst fest. Node-RED sucht keine Bluetooth-Sensoren und vertauscht die Rollen nach einem Neustart nicht.</span><span>Der zweite RuuviTag wird nach seiner festen Victron-DeviceInstance als Bodenfühler ergänzt.</span></div></template>
      </article>
    </div>
  </section>

  <section v-else-if="detail==='heater'" class="fs-page fs-detail-page">
    <div class="fs-detail-head"><button @click="detail=''">‹ ZURÜCK</button><svg class="fs-detail-icon"><use href="#fs-heater"></use></svg><div><small>SERIELL · CERBO GX</small><b>AUTOTERM AIR 2D</b><span>{{s.climate?.heater?.warning||s.climate?.heater?.status}}</span></div><button :class="['fs-head-action',s.climate?.heater?.on?'stop':'']" @click="heaterToggle">{{s.climate?.heater?.on?'STOPP':'STARTEN'}}</button></div>
    <div class="fs-heater-grid">
      <article><h3>Betriebsart</h3><div class="fs-segments"><button v-for="m in ['temperature','power','ventilation']" :class="{on:s.climate?.heater?.mode===m}" @click="heaterMode(m)">{{m==='temperature'?'TEMPERATUR':m==='power'?'LEISTUNG':'LÜFTEN'}}</button></div><div v-if="s.climate?.heater?.mode==='power'" class="fs-step"><button @click="heaterPower(-1)">−</button><div><b>{{fmt(s.climate?.heater?.powerLevel,0)}} / 10</b><small>LEISTUNGSSTUFE</small></div><button @click="heaterPower(1)">+</button></div><div v-else class="fs-step"><button @click="heat(-1)">−</button><div><b>{{fmt(s.climate?.heater?.setpoint,0)}} °C</b><small>SOLLTEMPERATUR</small></div><button @click="heat(1)">+</button></div><div class="fs-step compact"><button @click="heaterDuration(-60)">−</button><div><b>{{s.climate?.heater?.durationMinutes?fmt(s.climate.heater.durationMinutes/60,0)+' h':'DAUER'}}</b><small>LAUFZEIT</small></div><button @click="heaterDuration(60)">+</button></div><button :class="['fs-action',s.climate?.heater?.standbyVent?'on':'']" @click="heaterSetting('standbyVent',!s.climate?.heater?.standbyVent)">STANDBY-LÜFTUNG</button></article>
      <article><h3>Sensor & Schutz</h3><p><span>Regelsensor</span><b>{{s.climate?.heater?.effectiveSensor||'–'}}</b></p><p><span>Ersatzsensor</span><b>{{s.climate?.heater?.sensorFallback?'AKTIV':'NEIN'}}</b></p><button :class="['fs-action',s.climate?.heater?.frostEnabled?'on':'']" @click="heaterSetting('frostEnabled',!s.climate?.heater?.frostEnabled)">FROSTSCHUTZ {{s.climate?.heater?.frostEnabled?'AUS':'EIN'}}</button><div class="fs-step compact"><button @click="heaterFrost(-1)">−</button><div><b>{{fmt(s.climate?.heater?.frostTemp,0)}} °C</b><small>FROSTSTART</small></div><button @click="heaterFrost(1)">+</button></div><div class="fs-step compact"><button @click="heaterVoltage(-.1)">−</button><div><b>{{fmt(s.climate?.heater?.lowVoltage,1)}} V</b><small>UNTERSPANNUNG</small></div><button @click="heaterVoltage(.1)">+</button></div></article>
      <article><h3>Status & Technik</h3><p><span>Innenraum</span><b>{{fmt(s.climate?.roomTemperature,1)}} °C</b></p><p><span>Wärmetauscher</span><b>{{fmt(s.climate?.heater?.heatExchangerTemperature,1)}} °C</b></p><p><span>Heizung</span><b>{{fmt(s.climate?.heater?.voltage,1)}} V</b></p><p><span>Gebläse</span><b>{{fmt(s.climate?.heater?.fanRpm,0)}} rpm</b></p><p><span>Kraftstoffpumpe</span><b>{{fmt(s.climate?.heater?.pumpHz,2)}} Hz</b></p><p><span>Fehler</span><b>{{s.climate?.heater?.error||'KEINER'}}</b></p></article>
      <article><h3>AUTOTERM-Wartung</h3><p><span>Monatlicher Lauf</span><b>{{s.climate?.heater?.maintenanceDue?'FÄLLIG':'OK'}}</b></p><button class="fs-action" @click="heaterMaintenance">20-MIN-WARTUNGSLAUF STARTEN</button><p><span>Jahreswartung</span><b>{{s.climate?.heater?.annualServiceDue?'FÄLLIG':'OK'}}</b></p><button class="fs-action" @click="heaterAnnualDone">ALS ERLEDIGT EINTRAGEN</button><small>Wartungsläufe starten niemals automatisch.</small></article>
    </div>
  </section>

  <section v-else-if="detail==='fan'" class="fs-page fs-detail-page">
    <div class="fs-detail-head"><button @click="detail=''">‹ ZURÜCK</button><svg class="fs-detail-icon"><use href="#fs-fan"></use></svg><div><small>VANTURTLE WLAN-STEUERUNG · STAR-POWER CH 6</small><b>MAXXFAN</b></div><button :class="['fs-head-action',s.climate?.fan?.on?'stop':'']" @click="fanToggle">{{s.climate?.fan?.on?'AUS':'EIN'}}</button></div>
    <div class="fs-fan-detail"><article class="fs-hero"><small>DREHZAHL</small><strong>{{fmt(s.climate?.fan?.speed,0)}} %</strong><span>{{s.climate?.fan?.online?'WLAN VERBUNDEN':'OFFLINE'}} · {{s.climate?.fan?.mode||'–'}}</span><p><span>Versorgung CH 6</span><b>{{s.climate?.fan?.powered?'EIN':'AUS'}}</b></p><p><span>Leistung</span><b>{{fmt(s.climate?.fan?.power,1)}} W</b></p></article><article class="fs-fan-controls"><h3>Lüftersteuerung</h3><div class="fs-step"><button @click="fanStep(-10)">−</button><div><b>{{fmt(s.climate?.fan?.speed,0)}} %</b><small>DREHZAHL</small></div><button @click="fanStep(10)">+</button></div><div class="fs-presets"><button v-for="p in [10,30,50,70,100]" @click="fanSet(p)">{{p}}%</button></div><div class="fs-segments"><button :class="{on:s.climate?.fan?.mode==='forward'}" @click="fanSetMode('forward')">ZULUFT</button><button :class="{on:s.climate?.fan?.mode==='reverse'||s.climate?.fan?.mode==='extract'}" @click="fanSetMode('reverse')">ABLUFT</button></div><div class="fs-fan-actions"><button @click="fanLid">HAUBE</button><button :class="{on:s.climate?.fan?.autoHold}" @click="fanAuto">AUTO-HOLD</button></div><p><span>Kalibrierung</span><b>{{s.climate?.fan?.calibrating?'LÄUFT':(s.climate?.fan?.calibrated?'ERLEDIGT':'NICHT ERFASST')}}</b></p></article></div>
  </section>

  <section v-else-if="detail==='wifi'" class="fs-page fs-detail-page fs-wifi-page">
    <div class="fs-detail-head"><button @click="detail=''">‹ ZURÜCK</button><svg class="fs-detail-icon"><use href="#fs-wifi"></use></svg><div><small>NETGEAR USB-WLAN · VICTRON PLATFORM</small><b>EXTERNE WLAN-NETZE</b><span>{{externalWifi.available?(externalWifi.connectedSsid||externalWifi.state||'BEREIT'):'WLAN-ADAPTER NICHT VERFÜGBAR'}}</span></div><i :class="externalWifi.available?'online':'offline'"></i></div>

      <article class="fs-wifi-status"><small>INTERNET-UPLINK</small><strong>{{externalWifi.enabled?'EIN':'AUS'}}</strong><p><span>Status</span><b>{{externalWifi.state||'–'}}</b></p><p><span>Schnittstelle</span><b>{{externalWifi.interface||'–'}}</b></p><p><span>Verbunden</span><b>{{externalWifi.connectedSsid||'–'}}</b></p><p><span>Signal</span><b>{{externalWifi.signalStrength==null?'–':fmt(externalWifi.signalStrength,0)+' %'}}</b></p><p><span>Adresse</span><b>{{externalWifi.address||'–'}}</b></p><button :disabled="!externalWifi.available" :class="['fs-action',externalWifi.enabled?'on':'']" @click="externalWifiSet(!externalWifi.enabled)">EXTERNES WLAN {{externalWifi.enabled?'AUS':'EIN'}}</button><button :disabled="!externalWifi.available||externalWifi.scanActive" class="fs-action" @click="externalWifiScan">{{externalWifi.scanActive?'SUCHE LÄUFT …':'NETZWERKE SUCHEN'}}</button></article>

<script>
export default{
 data(){return{s:{},service:{},serviceNotice:'',page:'home',detail:'',rightView:false,dayMode:false,temperatureControlTab:0,wifiSelectedService:'',wifiPassphrase:'',v2Page:'home',v2EnergyPane:'power',v2SelectedLightId:'inside_main',v2RuntimeOpen:false}},
 computed:{
  inside(){return this.light('inside_main')},leftSide(){return this.light('outside_left')},rightSide(){return this.light('outside_right')},visibleSide(){return this.rightView?this.rightSide:this.leftSide},rear(){return this.light('outside_rear')},frontWhite(){return this.light('outside_front_white')},frontAmber(){return this.light('outside_front_amber')},frontActive(){return this.frontWhite.on||this.frontAmber.on},highBeam(){return this.s.vehicle?.highBeam||{}},
  lightOrder(){let ids=['inside_main','outside_left','outside_right','outside_rear','outside_front_white','outside_front_amber'];return ids.map(id=>this.light(id))},
  quickIds(){let ids=this.s.ui?.quickAccessIds;return Array.isArray(ids)&&ids.length===4?ids:['switch:water_pump','switch:starlink','switch:dc_outlets_left','light:inside_main']},quickOptions(){return Array.isArray(this.s.ui?.quickAccessOptions)?this.s.ui.quickAccessOptions:[]},quickItems(){return Array.isArray(this.s.ui?.quickAccess)?this.s.ui.quickAccess:[]},
  powerChannels(){return(this.s.power?.dcChannels||[]).filter(item=>Number(item.channel)!==3&&item.id!=='high_beam_manual')},
  starlinkLabel(){let x=this.s.power?.starlink||{};return !x.powered?'AUS':(x.online?'ONLINE':'VERBINDET')},
  temperatureReadings(){let t=this.s.climate?.temperatureSensors||{},h=this.s.climate?.heater||{};return[{name:'RAUMWERT',value:t.comfort?.temp??this.s.climate?.roomTemperature,note:t.comfort?.label||h.effectiveSensor||'Regelwert'},{name:'BODENHÖHE',value:t.floor?.temp,note:t.floor?.label||'RuuviTag Boden'},{name:'DECKENHÖHE',value:t.ceiling?.temp,note:t.ceiling?.label||'RuuviTag Decke'},{name:'AUTOTERM INTERN',value:h.internalTemperature,note:h.sensorFallback?'Ersatzsensor aktiv':'Heizung'}]},
  externalWifi(){let n=this.s.system?.network?.externalWifi||{},x=this.s.system?.service||{};return{available:n.available??Number(x.external_wifi_available)===1,enabled:n.enabled??Number(x.external_wifi_enabled)===1,state:String(n.state??x.external_wifi_state??''),signalStrength:n.signalStrength??(x.external_wifi_signal==null?null:Number(x.external_wifi_signal)),connectedSsid:String(n.connectedSsid??x.external_wifi_ssid??x.external_wifi_connected_ssid??''),interface:String(n.interface??x.external_wifi_interface??''),scanActive:n.scanActive??Number(x.external_wifi_scan_active)===1,connectSupported:n.connectSupported??Number(x.external_wifi_connect_supported)===1,address:String(n.address??x.external_wifi_address??''),networks:Array.isArray(n.networks)?n.networks:(Array.isArray(x.external_wifi_networks)?x.external_wifi_networks:[])}},
  selectedWifi(){return this.externalWifi.networks.find(network=>network.service===this.wifiSelectedService)||null},
  wifiPassphraseValid(){let network=this.selectedWifi;if(!network)return false;let length=this.wifiPassphrase.length;if(!network.secured)return length===0;if(network.favorite&&length===0)return true;return length>=8&&length<=256},
   wifiTileEnabled(){return this.s.ui?.externalWifiTileEnabled!==false},
   designVersion(){return this.s.ui?.designVersion==='v1'?'v1':'v2'},
   designV2(){return this.designVersion==='v2'},
   v2Clock(){let date=new Date(this.s.timestamp||Date.now());return Number.isNaN(date.getTime())?'–:–':date.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})},
   v2GaugeStyle(){let value=Number(this.s.energy?.battery?.soc),percent=Number.isFinite(value)?Math.max(0,Math.min(100,value)):0;return{background:'conic-gradient(#36b8ff 0 '+percent+'%, light-dark(#dce5e9, #26343f) '+percent+'% 100%)'}},

   v2LightZones(){return[{key:'inside',id:'inside_main',name:'Innen',icon:'cc2-light-cabin',light:this.inside},{key:'left',id:'outside_left',name:'Links',icon:'cc2-light-side-left',light:this.leftSide},{key:'right',id:'outside_right',name:'Rechts',icon:'cc2-light-side-right',light:this.rightSide},{key:'rear',id:'outside_rear',name:'Hinten',icon:'cc2-light-rear',light:this.rear}]},
   v2SelectedLight(){let selected=this.light(this.v2SelectedLightId);return selected?.dimmable?selected:this.inside},
   v2RuntimeLabel(){let minutes=Number(this.s.climate?.heater?.durationMinutes||0);return minutes===0?'Ohne Limit':minutes<60?minutes+' min':minutes/60+' h'},
   v2PowerChannels(){return this.powerChannels.slice(0,5)},
   v2WaterAvailable(){let value=this.s.water?.fresh?.level;return value!==null&&value!==''&&typeof value!=='undefined'&&Number.isFinite(Number(value))},
   v2WaterLevel(){let level=Number(this.s.water?.fresh?.level);return Number.isFinite(level)?Math.max(0,Math.min(100,level)):0},
   v2DeviceStatus(){let devices=this.s.operations?.devices||[],online=devices.filter(device=>device.online).length;return devices.length?online+' / '+devices.length:'–'},
   v2Nav(){return[{id:'home',name:'Home',icon:'cc2-home'},{id:'lights',name:'Licht',icon:'cc2-light-nav'},{id:'climate',name:'Klima',icon:'cc2-climate'},{id:'energy',name:'Energie',icon:'cc2-energy-battery'},{id:'water',name:'Wasser',icon:'cc2-water'},{id:'system',name:'System',icon:'cc2-settings'}]}
 },

  powerName(item){return Number(item.channel)===6?'MaxxFan':item.name},
   pageLabel(){const key=this.detail||this.page;return({home:'HOME',lights:'LICHT',power:'12 / 230 V',settings:'EINSTELLUNGEN',battery:'BATTERIEN',solar:'SOLAR + INDEVOLT',temperature:'TEMPERATUREN',heater:'AUTOTERM AIR 2D',fan:'MAXXFAN',wifi:'EXTERNES WLAN'}[key]||'HOME')},
    v2PageLabel(){return({home:'Home',lights:'Licht',climate:'Klima',energy:'Energie',water:'Wasser',system:'System'}[this.v2Page]||'Home')},
